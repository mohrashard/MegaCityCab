<div class="main-content">
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 1.5rem; color: #282a2c;">Book Your Ride</h1>

        <div class="vehicle-selector">
            <button class="nav-button prev"><i class="fas fa-chevron-left"></i></button>
            <div class="vehicle-container">
                <img src="" alt="Vehicle" class="vehicle-image" id="vehicleImage">
                <div class="vehicle-title" id="vehicleTitle">Car</div>
            </div>
            <button class="nav-button next"><i class="fas fa-chevron-right"></i></button>
        </div>

        <button class="select-button">Select Vehicle</button>

        <form class="booking-form" id="bookingForm" method="post" action="book">
            <input type="hidden" id="vehicleType" name="vehicleType" value="Car">

            <div class="form-group">
                <label for="pickup">Pickup Location</label>
                <input type="text" id="pickup" name="pickupLocation" class="form-control" placeholder="Enter pickup location" required>
            </div>

            <div class="form-group">
                <label for="dropoff">Drop-off Location</label>
                <input type="text" id="dropoff" name="dropoffLocation" class="form-control" placeholder="Enter drop-off location" required>
            </div>

            <div class="form-group">
                <label for="datetime">Date & Time</label>
                <input type="datetime-local" id="datetime" name="bookingDateTime" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <div class="payment-options">
                    <div class="payment-option" data-method="cash">
                        <i class="fas fa-money-bill-wave"></i> Cash
                    </div>
                    <div class="payment-option" data-method="card">
                        <i class="fas fa-credit-card"></i> Card
                    </div>
                    <div class="payment-option" data-method="wallet">
                        <i class="fas fa-wallet"></i> Wallet
                    </div>
                </div>
            </div>

            <input type="hidden" id="paymentMethod" name="paymentMethod" value="">

            <button type="submit" class="confirm-button">Confirm Booking</button>
        </form>
    </div>
</div>

<script>
    const vehicles = [
        { name: 'Car', image: 'images/car.png' },
        { name: 'Van', image: 'images/van.png' },
        { name: 'Three-wheeler', image: 'images/tuk-tuk.png' }
    ];

    let currentVehicleIndex = 0;

    const vehicleImage = document.getElementById('vehicleImage');
    const vehicleTitle = document.getElementById('vehicleTitle');
    const vehicleTypeInput = document.getElementById('vehicleType');
    const prevButton = document.querySelector('.prev');
    const nextButton = document.querySelector('.next');
    const selectButton = document.querySelector('.select-button');
    const bookingForm = document.getElementById('bookingForm');
    const paymentMethodInput = document.getElementById('paymentMethod');
    const datetimeInput = document.getElementById('datetime');

    function updateVehicle() {
        vehicleTitle.textContent = vehicles[currentVehicleIndex].name;
        vehicleImage.src = vehicles[currentVehicleIndex].image;
        vehicleImage.alt = vehicles[currentVehicleIndex].name;
        vehicleTypeInput.value = vehicles[currentVehicleIndex].name; // Update hidden input
    }

    nextButton.addEventListener('click', () => {
        currentVehicleIndex = (currentVehicleIndex + 1) % vehicles.length;
        updateVehicle();
    });

    prevButton.addEventListener('click', () => {
        currentVehicleIndex = (currentVehicleIndex - 1 + vehicles.length) % vehicles.length;
        updateVehicle();
    });

    selectButton.addEventListener('click', () => {
        bookingForm.classList.add('visible');
        selectButton.style.display = 'none';
    });

    document.querySelectorAll('.payment-option').forEach(option => {
        option.addEventListener('click', () => {
            document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
            option.classList.add('selected');
            paymentMethodInput.value = option.dataset.method;
        });
    });


bookingForm.addEventListener('submit', (e) => {
    e.preventDefault();

    if (!paymentMethodInput.value) {
        alert('Please select a payment method.');
        return;
    }

    const formData = new FormData(bookingForm);
    const urlEncoded = new URLSearchParams(formData).toString();

    const confirmButton = document.querySelector('.confirm-button');
    confirmButton.textContent = 'Processing...';
    confirmButton.disabled = true;

    fetch('book', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: urlEncoded
    })
    .then(response => {
        if (response.status === 400) {
            return response.text().then(text => { throw new Error(text); });
        }
        if (!response.ok) {
            throw new Error('Server error: ' + response.status);
        }
        return response.text();
    })
    .then(data => {
        alert('Booking confirmed!');
        bookingForm.reset();
        bookingForm.classList.remove('visible');
        selectButton.style.display = 'block';
    })
    .catch(error => {
        alert(error.message);
    })
    .finally(() => {
        confirmButton.textContent = 'Confirm Booking';
        confirmButton.disabled = false;
    });
});

const formData = new FormData(bookingForm);
for (const [key, value] of formData.entries()) {
    console.log(`${key}: ${value}`);
}

    const now = new Date();
    now.setMinutes(now.getMinutes() + 30);
    datetimeInput.value = now.toISOString().slice(0, 16);


    updateVehicle();
</script>
