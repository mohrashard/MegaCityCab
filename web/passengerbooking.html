<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Ride</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="stylesheet" href="css/passengerbooking.css">
    <link rel="website icon" href="images/megacitycablogo.png" type="png">
   
</head>
<body>

    <nav class="sidebar">
       
        <div class="logo">
    <img src="images/megacitycablogo.png" alt="Mega City Cab Logo" class="logo-img">
  Mega City Cab
</div>
        <ul class="nav-links">
            <li class="nav-item">
                <a href="passenger_dashboard.html" class="nav-link">
                    <i class="fas fa-home"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link active">
                    <i class="fas fa-car"></i> Book a Ride
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-history"></i> My Bookings
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-credit-card"></i> Billing
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-user"></i> Profile
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-question-circle"></i> Help
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="container">
            <h1 style="text-align: center; margin-bottom: 1.5rem; color: #282a2c;">Book Your Ride</h1>

            <div class="vehicle-selector">
                <button class="nav-button prev" ><i class="fas fa-chevron-left"></i></button>
                <div class="vehicle-container">
                    <img src="" alt="Vehicle" class="vehicle-image" id="vehicleImage">
                    <div class="vehicle-title" id="vehicleTitle">Car</div>
                </div>
                <button class="nav-button next" ><i class="fas fa-chevron-right"></i></button>
            </div>

            <button class="select-button" >Select Vehicle</button>

            <form class="booking-form" id="bookingForm">
                <div class="form-group">
                    <label for="pickup">Pickup Location</label>
                    <input type="text" id="pickup" class="form-control" placeholder="Enter pickup location" required>
                </div>

                <div class="form-group">
                    <label for="dropoff">Drop-off Location</label>
                    <input type="text" id="dropoff" class="form-control" placeholder="Enter drop-off location" required>
                </div>

                <div class="form-group">
                    <label for="datetime">Date & Time</label>
                    <input type="datetime-local" id="datetime" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Payment Method</label>
                    <div class="payment-options">
                        <div class="payment-option" data-method="cash">
                            <i class="fas fa-money-bill-wave"></i> Cash
                        </div>
                        <div class="payment-option" data-method="card">
                            <i class="fas fa-credit-card"></i> Card
                        </div>
                        <div class="payment-option" data-method="wallet">
                            <i class="fas fa-wallet"></i> Wallet
                        </div>
                    </div>
                </div>

                <button type="submit" class="confirm-button">Confirm Booking</button>
            </form>
        </div>
    </div>

    <script>
 

        const vehicles = [
            { name: 'Car', image: 'images/car.png' },
            { name: 'Van', image: 'images/van.png' },
            { name: 'Three-wheeler', image: 'images/tuk-tuk.png' }
        ];
        
        let currentVehicleIndex = 0;
        let direction = 'right';

        const vehicleImage = document.getElementById('vehicleImage');
        const vehicleTitle = document.getElementById('vehicleTitle');
        const prevButton = document.querySelector('.prev');
        const nextButton = document.querySelector('.next');
        const selectButton = document.querySelector('.select-button');
        const bookingForm = document.getElementById('bookingForm');

        function updateVehicle() {
            vehicleImage.classList.remove('slide-left', 'slide-right');
            void vehicleImage.offsetWidth; 
            vehicleImage.classList.add(direction === 'right' ? 'slide-left' : 'slide-right');
       
            vehicleTitle.textContent = vehicles[currentVehicleIndex].name;
            vehicleImage.src = vehicles[currentVehicleIndex].image;
            vehicleImage.alt = vehicles[currentVehicleIndex].name;
        }

        nextButton.addEventListener('click', () => {
            direction = 'right';
            currentVehicleIndex = (currentVehicleIndex + 1) % vehicles.length;
            updateVehicle();
        });

        prevButton.addEventListener('click', () => {
            direction = 'left';
            currentVehicleIndex = (currentVehicleIndex - 1 + vehicles.length) % vehicles.length;
            updateVehicle();
        });

   
        selectButton.addEventListener('click', () => {
            bookingForm.classList.add('visible');
            selectButton.style.display = 'none';
        });

       
        const paymentOptions = document.querySelectorAll('.payment-option');
        paymentOptions.forEach(option => {
            option.addEventListener('click', () => {
                paymentOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
            });
        });


          bookingForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
           
            const selectedVehicle = vehicles[currentVehicleIndex].name;
       
            const pickup = document.getElementById('pickup').value;
            const dropoff = document.getElementById('dropoff').value;
            const datetime = document.getElementById('datetime').value;
            
          
            const selectedPayment = document.querySelector('.payment-option.selected');
            const paymentMethod = selectedPayment ? selectedPayment.dataset.method : null;
           
            if (!pickup || !dropoff || !datetime || !paymentMethod) {
                alert('Please fill in all fields and select a payment method.');
                return;
            }
            

            alert(`Booking confirmed!\nVehicle: ${selectedVehicle}\nPickup: ${pickup}\nDrop-off: ${dropoff}\nDate & Time: ${datetime}\nPayment: ${paymentMethod}`);
        });

  
        updateVehicle();
        
    
        const datetimeInput = document.getElementById('datetime');
        if (datetimeInput) {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 30); 
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            datetimeInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
        }

     
        
    </script>
</body>
</html>
